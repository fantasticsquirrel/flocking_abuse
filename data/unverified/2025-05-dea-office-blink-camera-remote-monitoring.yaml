verification_status:
  reason: >-
    The misconduct finding is authoritative, but the public record redacts the office location and all usable
    occurred and discovery dates. It therefore cannot be placed on the documented chronology without inventing a date.
  evidence_needed:
    - "An unredacted or independently documented date range for installation and remote monitoring"
    - "A source-supported date when DEA or DOJ first discovered the camera use"
    - "The office location, if it can be published without exposing protected personnel information"
