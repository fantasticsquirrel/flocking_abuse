schema_version: 1
id: 2025-05-dea-office-blink-camera-remote-monitoring
title: "DOJ OIG substantiated unauthorized remote monitoring through a personal Blink camera in a DEA office"
summary: >-
  The U.S. Department of Justice Office of the Inspector General substantiated that a DEA Special Agent in Charge
  installed a personally owned Blink camera in a DEA office and used it to remotely monitor real-time video and
  audio without the knowledge of people in view. The public investigative summary reports a policy violation, but
  the dates and location of the underlying conduct are redacted, preventing chronology-safe placement as a
  documented incident.
