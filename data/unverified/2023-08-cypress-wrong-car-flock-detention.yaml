title: "Cypress men reportedly detained after deputies followed the wrong Flock-flagged car"
summary: >-
  ABC13 reported that Harris County deputies detained two 19-year-old men at gunpoint on August 3, 2023 after a
  Flock alert identified a stolen Chevrolet Camaro and an undercover unit followed a similar car without confirming
  its plate. Deputies released the men after determining they had stopped the wrong vehicle. No incident report,
  department finding, lawsuit, or independent contemporaneous report has been located.
