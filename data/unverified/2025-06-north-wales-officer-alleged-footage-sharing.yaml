id: 2025-06-north-wales-officer-alleged-footage-sharing
title: "North Wales officer accused of sharing body-camera and council CCTV recordings through personal channels"
summary: >-
  North Wales Police alleges that Constable 4021 Sheppard shared body-worn-video and local-authority CCTV
  recordings with colleagues through social-media messaging platforms and a personal phone between June 12, 2025
  and January 17, 2026 without a policing purpose. The matter is scheduled for a misconduct hearing on September 2,
  2026 and has not been adjudicated.
