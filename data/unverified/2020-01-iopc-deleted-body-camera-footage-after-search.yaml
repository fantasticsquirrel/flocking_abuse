id: 2020-01-iopc-deleted-body-camera-footage-after-search
title: "IOPC case study reported body-camera footage deleted days after a search of a 17-year-old"
summary: >-
  An Independent Office for Police Conduct case study says an officer recorded a search and use of force involving
  a 17-year-old, showed the footage to a line manager, and deleted it about five days later because the officer did
  not expect a complaint. The anonymized case study does not identify the police force or state the incident or
  discovery date, so it cannot be safely matched or placed in the documented timeline.
