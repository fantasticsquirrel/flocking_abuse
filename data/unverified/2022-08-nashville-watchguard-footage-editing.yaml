id: 2022-08-nashville-watchguard-footage-editing
title: "Nashville employees reportedly edited WatchGuard body-camera footage without permission"
summary: >-
  WPLN reported that a Metro Nashville Police Department internal investigation found two civilian IT employees had
  removed profanity from body-camera recordings without permission, including footage supplied to the Community
  Oversight Board for a police-misconduct investigation. WPLN later reported that MNPD was reviewing more than 300
  recordings, but the underlying internal-investigation file is not linked in a stable public copy and the available
  reports are from one newsroom.
