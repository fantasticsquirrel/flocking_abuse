id: 2023-04-tesla-employee-camera-sharing
title: "Tesla employees reportedly shared sensitive vehicle-camera recordings"
summary: >-
  Reuters reported, based on interviews with nine former employees, that Tesla workers circulated sensitive images
  and videos captured by customer-vehicle cameras through internal messaging channels between 2019 and 2022. A later
  proposed class action repeated the allegations, and two U.S. senators requested answers from Tesla. No public
  regulator finding, adjudicated merits finding, or company admission has been located, so the case remains reported
  but unverified.
