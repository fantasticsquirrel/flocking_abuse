id: 2026-02-pelco-sarix-professional-3-unauthenticated-live-feed
title: "Pelco Sarix Professional 3 vulnerability reportedly allowed unauthenticated live-feed access"
summary: >-
  NIST's National Vulnerability Database describes CVE-2026-1241 as an access-control flaw in affected Pelco Sarix
  Professional 3 camera firmware that can allow an unauthenticated attacker to view a live feed. The disclosure does
  not establish malicious exploitation, an exposed deployment, or a source-supported discovery date distinct from
  the vulnerability's publication chronology.
