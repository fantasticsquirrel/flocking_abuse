id: 2026-06-burbank-former-employees-flock-access
title: "Burbank audit reportedly found former employees retained Flock access"
summary: >-
  Public Records Southern California reported that a Burbank Police Department audit, signed May 15, 2026,
  recorded the deactivation of three recently separated employees' Flock accounts. The report links the audit
  produced through a California public-records request, but no independent newsroom or direct city finding has
  established how long the accounts remained usable or whether any former employee accessed the system.
