verification_status:
  reason: >-
    The claim currently rests on one advocacy publisher's interpretation of records it obtained. The linked audit
    does not establish how long the accounts remained active or whether the former employees used them after leaving.
  evidence_needed:
    - "A stable direct copy of the complete audit production from the City of Burbank"
    - "Account or access logs establishing whether the former employees logged in after separation"
    - "An official city response or independent reliable corroboration"
