title: "Raleigh audits reportedly listed former employees as active Flock users"
summary: >-
  A Raleigh community post, citing audit files released through MuckRock, reported that an April 8, 2026 Raleigh
  Police Department audit found several active Flock users were no longer department employees. The post further
  alleged the condition remained unresolved in a May audit. The underlying public-record production is linked, but
  the claim has not been independently reported and the affected accounts have not been publicly identified.
