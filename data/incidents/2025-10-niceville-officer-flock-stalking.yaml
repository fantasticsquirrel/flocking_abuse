title: "Niceville officer pleaded no contest after Flock tracking"
status: verified
summary: >-
  Reporting on a Niceville Police Department internal investigation said Officer Coty Hall used
  the agency's Flock license-plate system and other law-enforcement databases to track another
  officer and harass that officer's spouse. Hall was arrested and fired, then pleaded no contest
  to four reduced misdemeanor unauthorized-computer-access counts in April 2026.
