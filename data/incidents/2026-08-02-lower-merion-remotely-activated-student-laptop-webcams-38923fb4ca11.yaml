id: 2026-08-02-lower-merion-remotely-activated-student-laptop-webcams-38923fb4ca11
title: Lower Merion remotely activated student laptop webcams
status: verified
category: institutional-overreach
summary: >-
  The Christian Science Monitor reported that Lower Merion School District acknowledged remotely activating webcams and
  capturing screens on school-issued laptops, while a district-commissioned investigation found more than 40 students
  had been monitored and could not locate authorization for 10 of them. A court-filed amicus brief argued that the
  alleged warrantless home monitoring implicated the Fourth Amendment while expressly assuming the plaintiffs’
  allegations were valid; federal authorities later declined criminal charges after finding insufficient evidence of
  criminal intent beyond a reasonable doubt.
