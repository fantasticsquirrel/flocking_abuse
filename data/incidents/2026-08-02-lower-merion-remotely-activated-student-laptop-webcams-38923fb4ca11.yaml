sources:
  - url: https://www.csmonitor.com/USA/Justice/2010/0817/Did-school-use-laptops-to-spy-on-students-Feds-won-t-press-charges
    title: Did school use laptops to spy on students? Feds won't press charges.
    publisher: The Christian Science Monitor
    published_date: '2010-08-17'
    source_type: news
    archive_url: >-
      https://web.archive.org/web/20260208164719/https://www.csmonitor.com/USA/Justice/2010/0817/Did-school-use-laptops-to-spy-on-students-Feds-won-t-press-charges
    reliability: corroborating
    key_claims:
      - >-
        The district acknowledged that it could remotely activate webcams on school-issued laptops and capture students’
        screens.
      - >-
        The district-commissioned investigation found more than 40 students were monitored, producing 30,881 webcam
        photographs and 27,761 screenshots.
      - >-
        Investigators could not locate authorization for monitoring 10 students; recovered material for those cases
        included 2,507 photographs and 2,212 screenshots.
      - >-
        Federal authorities declined charges after finding insufficient evidence that anyone involved acted with
        criminal intent beyond a reasonable doubt.
  - url: https://spectrum.ieee.org/school-district-webcam-spying-report-published
    title: School District Webcam "Spying" Report Published
    publisher: IEEE Spectrum
    published_date: '2010-05-04'
    source_type: news
    archive_url: >-
      https://web.archive.org/web/20240417022726/https://spectrum.ieee.org/school-district-webcam-spying-report-published
    reliability: corroborating
    key_claims:
      - >-
        IEEE Spectrum reported that the district supplied Apple laptops with built-in webcams to 2,300 high-school
        students.
      - >-
        Its review of the district-commissioned report described inconsistent policies, poor recordkeeping, and
        overzealous technology use without apparent regard for privacy.
      - >-
        The report found no deliberate spying or voyeurism and recommended new policies, alternatives to webcam-based
        tracking, and privacy training.
  - url: https://www.aclupa.org/app/uploads/2019/06/robbins_amicus_brief_2-22-10_.pdf
    title: Brief of Amicus Curiae ACLU of Pennsylvania Supporting Issuance of Injunction
    publisher: U.S. District Court for the Eastern District of Pennsylvania
    published_date: '2010-02-22'
    source_type: court-record
    archive_url: >-
      https://web.archive.org/web/20250907203953/https://www.aclupa.org/app/uploads/2019/06/robbins_amicus_brief_2-22-10_.pdf
    reliability: primary
    key_claims:
      - The filed brief identifies Robbins v. Lower Merion School District as civil action 2:10-cv-00665-JD.
      - >-
        The brief asked the court to enjoin the district from activating student laptop cameras or other electronic
        monitoring devices while expressly assuming the plaintiffs’ allegations were valid.
      - >-
        The brief argued that alleged warrantless, non-consensual use of student laptop cameras inside homes constituted
        a Fourth Amendment search.
  - url: https://www.cbsnews.com/news/610k-settlement-in-school-webcam-spy-case/
    title: $610K Settlement in School Webcam Spy Case
    publisher: CBS News
    published_date: '2010-10-21'
    source_type: news
    archive_url: https://web.archive.org/web/20260618074850/https://www.cbsnews.com/news/610k-settlement-in-school-webcam-spy-case/
    reliability: corroborating
    key_claims:
      - >-
        CBS News reported that district officials admitted capturing thousands of webcam photographs and screenshots
        while attempting to locate missing school-issued computers.
      - >-
        CBS News reported a $610,000 settlement resolving the Robbins and Hasan laptop cases and quoted the district’s
        acknowledgment and apology for mistakes.
