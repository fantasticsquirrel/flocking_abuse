title: "Jerome County sheriff repeatedly searched wife's plate in Flock"
status: verified
summary: >-
  Flock logs obtained by local reporters showed Jerome County Sheriff George Oppedyk searched his
  wife's license plate more than 700 times from early July through mid-September 2025, labeling the
  searches as tests. Oppedyk told Idaho attorney-general investigators he was evaluating the system
  before a contract decision. The attorney general found insufficient evidence to prove a crime,
  while noting its review did not decide policy violations. Oppedyk retired early and relinquished
  his law-enforcement certification in April 2026.
