    archive_url: >-
      https://web.archive.org/web/20250820034726/https://community.ui.com/questions/Bug-Fix-Cloud-Access-Misconfiguration/fe8d4479-e187-4471-bf95-b2799183ceb7
    reliability: primary
    key_claims:
      - >-
        Ubiquiti said an upgrade to its UniFi Cloud infrastructure caused 1,216 accounts to be improperly associated
        with a separate group of 1,177 accounts.
      - Ubiquiti said the misconfiguration lasted from 06:47 to 15:45 UTC on December 13, 2023.
      - >-
        Ubiquiti said some users received push notifications from consoles assigned to other accounts, and users
        attempting to sign in may have been granted temporary remote access to an account that was not theirs.
      - >-
        Ubiquiti said it solved the misconfiguration and believed fewer than a dozen accounts were actually accessed by
        another user.
      - Ubiquiti said it planned to notify accounts in the potentially affected group by email.
  - url: https://arstechnica.com/security/2023/12/unifi-devices-broadcasted-private-video-to-other-users-accounts/
    title: UniFi devices broadcasted private video to other users’ accounts
    publisher: Ars Technica
    published_date: '2023-12-14'
    source_type: news
    archive_url: >-
      https://web.archive.org/web/20260608220341/https://arstechnica.com/security/2023/12/unifi-devices-broadcasted-private-video-to-other-users-accounts/
    reliability: corroborating
    key_claims:
      - >-
        Ars Technica documented reports that UniFi users received private camera feeds from, and control over, devices
        belonging to other users.
      - >-
        Ars Technica inspected screenshots accompanying a report that a UniFi Protect notification included a still
        image from a security camera that did not belong to the recipient.
      - >-
        Ars Technica reported another user’s account of receiving full access to 88 consoles belonging to a different
        account until a forced browser refresh.
      - >-
        Ars Technica reproduced Ubiquiti’s statement that the account associations resulted from an upgrade to its UniFi
        Cloud infrastructure and had been corrected.
