id: 2026-08-02-ubiquiti-cloud-misconfiguration-exposed-unifi-accounts-across-customer-6ee1593785c6
title: Ubiquiti cloud misconfiguration exposed UniFi Protect camera data across customers
status: verified
category: security-breach
summary: >-
  Ubiquiti said an upgrade to its UniFi Cloud infrastructure improperly associated 1,216 customer accounts with a
  separate group of 1,177 accounts on December 13, 2023. The company said some users received push notifications from
  consoles assigned to other accounts and users attempting to sign in may have been granted temporary remote access to
  an account that was not theirs. Ars Technica documented user reports and screenshots showing UniFi Protect
  notifications and private security-camera images or feeds from systems that did not belong to the viewers. Ubiquiti
  said it fixed the misconfiguration and believed fewer than a dozen accounts were actually accessed by another user.
