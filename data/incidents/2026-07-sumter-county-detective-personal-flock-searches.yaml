title: "Sumter County detective charged after tracking husband's ex-wife"
status: verified
summary: >-
  A Sumter County Sheriff's Office audit found that Detective Brandy Almany allegedly used the
  agency's Flock license-plate system and other restricted databases to obtain information about
  her husband's ex-wife, then used unrelated case numbers and false justifications to make the
  searches appear connected to legitimate investigations. She was fired and arrested.
