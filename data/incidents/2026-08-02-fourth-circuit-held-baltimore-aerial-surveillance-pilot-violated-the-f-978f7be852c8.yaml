    archive_url: https://web.archive.org/web/20260425080831/https://www.ca4.uscourts.gov/opinions/201495A.P.pdf
    reliability: primary
    key_claims:
      - >-
        The en banc Fourth Circuit identified the Baltimore Police Department and its commissioner as operators of the
        Aerial Investigation Research program in partnership with Persistent Surveillance Systems.
      - >-
        The court described the cameras as capturing roughly 32 square miles per image each second, with planes flying
        at least 40 hours per week and obtaining an estimated 12 hours of coverage of about 90 percent of Baltimore each
        day.
      - >-
        The court held that accessing AIR data was a search and that the program's warrantless operation violated the
        Fourth Amendment, then reversed and remanded the case.
