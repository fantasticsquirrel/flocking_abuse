outcomes:
  - >-
    The en banc Fourth Circuit reversed and remanded after holding that accessing AIR data was a search and that the
    program’s warrantless operation violated the Fourth Amendment.
  - >-
    Baltimore City leadership did not renew the pilot; the court said the Baltimore Police Department deleted most AIR
    data while retaining material tied to specific investigations.
