title: Fourth Circuit held Baltimore aerial surveillance pilot violated the Fourth Amendment
status: verified
category: institutional-overreach
summary: >-
  In a June 24, 2021 en banc opinion, the U.S. Court of Appeals for the Fourth Circuit held that accessing data from the
  Baltimore Police Department's Aerial Investigation Research pilot was a search and that the program's warrantless
  operation violated the Fourth Amendment. The court described a citywide system operated with Persistent Surveillance
  Systems that captured roughly 32 square miles per image each second and retained imagery for later investigative use.
