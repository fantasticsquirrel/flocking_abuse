title: "Kenosha County deputy used Flock to monitor coworker"
status: verified
summary: >-
  A Kenosha County Sheriff's Office internal investigation found Deputy Frank McGrath used Flock
  and the agency's Polaris squad-vehicle tracking system to monitor a coworker with whom he had a
  personal relationship. Records described about 16 Flock searches on one day without a case number
  or documented law-enforcement purpose and roughly 40 off-duty Polaris checks over several months.
  McGrath resigned through a negotiated separation agreement. He was not criminally charged, and a
  later John Doe petition seeking an investigation was sealed.
