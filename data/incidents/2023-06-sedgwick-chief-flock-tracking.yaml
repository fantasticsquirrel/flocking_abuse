id: 2023-06-sedgwick-chief-flock-tracking
title: "Sedgwick chief used Flock to track former partner and her boyfriend"
status: verified
summary: >-
  A Kansas certification order found that former Sedgwick Police Chief Lee Nygaard used Flock
  license-plate readers 164 times to track his former girlfriend's vehicle and 64 times to track
  her new boyfriend's vehicle. He also followed them in a police vehicle and admitted jealousy
  influenced his conduct. Nygaard resigned during a city misconduct investigation, and Kansas
  revoked his law-enforcement certification.
