title: "Prairie Grove officer accused of hundreds of personal Flock searches"
status: verified
summary: >-
  McHenry County prosecutors allege that William Copp, a part-time Prairie Grove officer who also
  served as Holiday Hills police chief, used Prairie Grove's Flock system nearly 250 times and the
  Illinois LEADS database 31 times for personal purposes. The alleged searches involved six people,
  including three former romantic partners and another partner's former boyfriend. Prairie Grove
  fired Copp, Holiday Hills records show he resigned, and 12 felony official-misconduct counts were
  pending in July 2026.
