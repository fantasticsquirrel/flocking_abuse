title: Houlton camera logs showed thousands of profile and vehicle searches
status: verified
category: institutional-overreach
summary: >-
  Access logs obtained by the Bangor Daily News showed that Houlton employees used the town's Verkada camera system
  throughout 2024, including more than 56,000 live-feed activations, 4,867 vehicle searches, and 5,266 entries labeled
  "Profile Searched" or "Profile Searched with Details." The logs did not establish whether those profile-search events
  invoked facial recognition, town officials had not confirmed that point, and residents' allegations that the system
  violated Maine law were not adjudicated. Official minutes record that the Town Council unanimously approved signing an
  amended settlement concerning the camera system; the Bangor Daily News reported that the agreement required camera
  removal, data deletion subject to legal-preservation duties, and a third-party audit.
