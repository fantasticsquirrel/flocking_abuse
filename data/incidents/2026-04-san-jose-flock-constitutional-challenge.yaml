id: 2026-04-san-jose-flock-constitutional-challenge
title: "San José residents challenged large-scale warrantless Flock surveillance"
status: verified
summary: >-
  San José residents filed a federal class-action complaint alleging that the police department's
  Flock network collected hundreds of millions of vehicle photographs and allowed more than 1,000
  employees to search movement data without a warrant, probable cause, or individualized suspicion.
  The plaintiffs sought declaratory and injunctive relief under the Fourth Amendment.
