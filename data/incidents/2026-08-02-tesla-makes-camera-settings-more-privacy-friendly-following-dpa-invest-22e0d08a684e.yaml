title: Tesla makes camera settings more privacy-friendly following DPA investigation
status: verified
category: institutional-overreach
summary: >-
  The Dutch Data Protection Authority said its investigation found that Tesla Sentry Mode had continuously filmed around
  parked vehicles and retained footage for one hour. Tesla then changed the feature so cameras are disabled by default,
  recording requires user activation, and retained footage is limited to one to ten minutes. The authority imposed no
  fine or other sanction because it concluded that vehicle owners, not Tesla, were legally responsible for recorded
  images.
