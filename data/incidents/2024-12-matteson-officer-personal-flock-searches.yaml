title: "Matteson officer resigned during investigation of personal Flock searches"
status: verified
summary: >-
  A Matteson Police Department internal investigation found Officer Jaila Cole-Clark used Flock
  for hundreds of searches involving a former domestic partner and that person's new partner.
  Investigators concluded the searches had no law-enforcement purpose and violated department
  policies governing criminal-justice information and technology use. Cole-Clark resigned during
  the investigation; the internal report says the administrative case was closed after her
  resignation and does not report criminal charges.
