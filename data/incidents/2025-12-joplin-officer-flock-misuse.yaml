title: "Joplin officer left department after Flock policy violation"
status: verified
summary: >-
  The Joplin Police Department said an internal investigation found that an unidentified officer
  violated policy through improper use of its Flock license-plate reader system. The officer was
  placed on leave and later left city employment. Public-record reporting found one plate had
  allegedly been searched about 395 times. The department referred the matter to the Missouri
  State Highway Patrol for an independent criminal review.
