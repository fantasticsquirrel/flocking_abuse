title: "Costa Mesa officer pleaded guilty after personal Flock tracking"
status: verified
summary: >-
  The Orange County District Attorney said former Costa Mesa officer Robert Jay Josett used Flock
  and other confidential police databases to locate his wife, an ex-girlfriend, and another person.
  He pleaded guilty to three misdemeanor counts and received three years of informal probation.
