title: Ring accounts hijacked for livestreamed swatting attacks
status: verified
category: security-breach
summary: >-
  The U.S. Attorney's Office reported that conspirators used compromised email credentials that victims had reused for
  Ring accounts to access internet-connected doorbell cameras during a one-week nationwide swatting spree in November
  2020. They made hoax emergency calls, livestreamed responding police through the compromised cameras, and sometimes
  taunted officers and residents. One participant pleaded guilty to conspiracy and unauthorized computer access and was
  sentenced to 44 months in federal prison.
