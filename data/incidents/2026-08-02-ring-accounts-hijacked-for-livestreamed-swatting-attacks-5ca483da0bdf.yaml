    reliability: primary
    key_claims:
      - >-
        The U.S. Attorney's Office said that from November 7 through November 13, 2020, the conspirators gained
        unauthorized access to Ring home-security cameras by testing compromised Yahoo account credentials against Ring
        accounts using the same email address and password.
      - >-
        The U.S. Attorney's Office said the conspirators made false emergency reports to provoke armed police responses,
        then transmitted audio and video from compromised Ring devices on social media and sometimes taunted responding
        officers and residents through the devices.
      - >-
        The U.S. Attorney's Office said Kya Christian Nelson pleaded guilty to conspiracy and two counts of unauthorized
        access to a protected computer and was sentenced on May 1, 2025 to 44 months in federal prison.
