outcomes:
  - >-
    Kya Christian Nelson pleaded guilty on January 23, 2025 to one count of conspiracy and two counts of unauthorized
    access to a protected computer to obtain information.
  - A federal judge sentenced Nelson on May 1, 2025 to 44 months in prison.
  - >-
    The Justice Department reported that co-conspirator James Thomas Andrew McCarty pleaded guilty to the same
    conspiracy and received a seven-year federal sentence in June 2024 for this case and additional charges.
