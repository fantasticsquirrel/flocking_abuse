title: "Baytown opened internal and criminal probes into alleged Flock misuse"
status: verified
summary: >-
  Baytown Police Chief John Stringer said the department opened internal-affairs and criminal
  investigations after receiving allegations that an unidentified officer misused its Flock
  license-plate reader system. The department requested assistance from the Harris County
  District Attorney's Office. Officials did not disclose the nature of the alleged misuse or
  announce a finding.
