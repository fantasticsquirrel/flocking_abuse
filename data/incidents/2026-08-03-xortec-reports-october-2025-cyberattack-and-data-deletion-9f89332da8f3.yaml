title: Xortec reports October 2025 cyberattack and data deletion
status: verified
category: security-breach
summary: >-
  Xortec GmbH said a cyberattack on October 1, 2025 deleted data on individual IT systems and sought to extort a ransom.
  The company said its ordering systems, website, and contact channels were unaffected and that all data was restored by
  October 4. Xortec did not report data exfiltration or exposure of customer or surveillance data in its notice.
