title: "Menasha officer accused of using Flock to track former partner"
status: verified
summary: >-
  A criminal complaint alleged that Menasha Police Officer Cristian Morales used his Flock account
  while off duty to search for a former partner's vehicles five times over eight days, listing
  "welfare" as a reason for some searches. Appleton police arrested Morales, prosecutors charged
  him with felony misconduct in public office, and Menasha placed him on administrative leave.
