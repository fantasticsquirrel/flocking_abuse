id: 2026-05-racine-county-officers-flock-misuse
title: "Racine agencies investigated four Flock-misuse cases involving five officers"
status: verified
summary: >-
  Racine police, the Racine County Sheriff's Office, and the county district attorney confirmed four
  separate Flock-misuse cases involving five unidentified officers. One sheriff's deputy searched
  after a significant other reported fear of immediate harm from an ex-husband; one Racine officer
  searched for a vehicle the officer co-owned. Prosecutors declined charges in those two cases.
  Outside agencies continued investigating a second sheriff's-office case and a Racine police case
  involving two officers. Officials had not disclosed the active cases' underlying conduct or
  announced charging decisions when reviewed.
