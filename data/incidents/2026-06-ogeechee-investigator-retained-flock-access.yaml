title: "Former sheriff's employee charged after 60-plus Flock searches"
status: verified
summary: >-
  The Georgia Bureau of Investigation said Ogeechee Circuit District Attorney's Office investigator
  Andrae Wright retained access to a former employer's Flock account and used it more than 60 times
  for non-law-enforcement purposes. He was arrested on stalking, computer-privacy, oath, and ALPR-
  misuse charges.
