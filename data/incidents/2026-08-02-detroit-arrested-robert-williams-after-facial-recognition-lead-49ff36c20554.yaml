outcomes:
  - >-
    NPR reported that the Wayne County prosecutor dismissed the criminal charge for insufficient evidence and
    apologized, stating that the case should not have been issued based on the Detroit Police Department investigation.
  - >-
    On June 28, 2024, the federal court dismissed the civil claims with prejudice pursuant to the parties’ settlement
    and retained jurisdiction to enforce the agreement for four years.
  - >-
    The settlement expressly states that it is a compromise of disputed claims and not an admission of liability by the
    defendants.
  - >-
    Detroit agreed to independent-evidence requirements, supervisory review, training, revised lineup procedures, and an
    audit of earlier facial-recognition cases followed by arrests or warrants.
