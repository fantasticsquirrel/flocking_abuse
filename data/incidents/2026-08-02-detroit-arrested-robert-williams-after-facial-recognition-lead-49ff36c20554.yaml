sources:
  - url: https://assets.aclu.org/live/uploads/2024/01/54.-First-Amended-Complaint.pdf
    title: First Amended Complaint, Williams v. City of Detroit
    publisher: U.S. District Court for the Eastern District of Michigan
    published_date: '2023-06-23'
    source_type: court-record
    archive_url: >-
      https://web.archive.org/web/20260503063320/https://assets.aclu.org/live/uploads/2024/01/54.-First-Amended-Complaint.pdf
    reliability: primary
    key_claims:
      - >-
        The complaint alleged that Detroit police arrested Robert Williams on January 9, 2020 after a facial-recognition
        search of a poorly lit security-camera image identified him as a possible match.
      - >-
        The complaint alleged that investigators relied on a lineup involving a security consultant who had not
        witnessed the theft and that the warrant application omitted facts undermining the facial-recognition and lineup
        evidence.
      - >-
        The complaint stated that both the Detroit Police Department and Michigan State Police contracted with
        DataWorks, a system shell through which facial-recognition algorithms could be run.
      - >-
        The complaint alleged constitutional and state-law violations; these allegations were disputed and were not
        adjudicated on the merits.
  - url: https://assets.aclu.org/live/uploads/2024/06/Final-Order-of-Dismissal-and-Settlement-Agreement.pdf
    title: Stipulated Order of Voluntary Dismissal and Settlement Agreement, Williams v. City of Detroit
    publisher: U.S. District Court for the Eastern District of Michigan
    published_date: '2024-06-28'
    source_type: court-record
    archive_url: >-
      https://web.archive.org/web/20260503063321/https://assets.aclu.org/live/uploads/2024/06/Final-Order-of-Dismissal-and-Settlement-Agreement.pdf
    reliability: primary
    key_claims:
      - >-
        The court entered the parties’ stipulated dismissal with prejudice after a negotiated settlement and retained
        jurisdiction to enforce the agreement for four years.
      - >-
        The agreement states that it compromises disputed claims and is not an admission of liability by Detroit or the
        other defendants.
      - >-
        Detroit agreed to require independent reliable evidence beyond a facial-recognition lead and lineup before an
        arrest or warrant request, train personnel, and audit earlier facial-recognition cases followed by arrests or
        warrants.
  - url: >-
      https://www.npr.org/2020/06/24/882683463/the-computer-got-it-wrong-how-facial-recognition-led-to-a-false-arrest-in-michig
    title: '''The Computer Got It Wrong'': How Facial Recognition Led To False Arrest Of Black Man'
    publisher: NPR
    published_date: '2020-06-24'
    source_type: news
    archive_url: >-
      https://web.archive.org/web/20260423072510/https://www.npr.org/2020/06/24/882683463/the-computer-got-it-wrong-how-facial-recognition-led-to-a-false-arrest-in-michig
    reliability: corroborating
    key_claims:
      - >-
        NPR reported that Michigan State Police conducted the facial-recognition search at Detroit police’s request and
        that the resulting lead prompted the arrest.
      - >-
        NPR reported that Williams was detained for 30 hours and that the Wayne County prosecutor dropped the charge for
        insufficient evidence and apologized, saying the case should not have been issued based on the police
        investigation.
      - >-
        NPR identified DataWorks Plus as the company that supplied Detroit police with its facial-recognition software;
        that attribution does not establish that the company directed the investigation or arrest.
