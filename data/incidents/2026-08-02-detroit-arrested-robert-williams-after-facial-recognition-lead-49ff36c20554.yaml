  notes: >-
    Published under the site owner’s standing authorization after direct inspection of the amended federal complaint,
    the court-entered settlement, and NPR’s contemporaneous report. Classified as Institutional overreach because this
    concerns a formally authorized police facial-recognition workflow and investigation rather than a technical breach
    or personal misuse of valid credentials. The report attributes disputed allegations to the complaint, states that
    the settlement was not an admission of liability, and limits adjudicated facts to the court’s dismissal and
    enforceable settlement terms. DataWorks Plus attribution is sourced to the complaint and NPR and does not allege
    that the vendor directed the investigation or arrest. Protected intake and fresh post-enrichment comparison against
    69 other runtime records returned no exact or probable duplicate.
