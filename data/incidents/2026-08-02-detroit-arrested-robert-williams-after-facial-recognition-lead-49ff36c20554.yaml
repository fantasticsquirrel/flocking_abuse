id: 2026-08-02-detroit-arrested-robert-williams-after-facial-recognition-lead-49ff36c20554
title: Detroit arrested Robert Williams after facial-recognition lead
status: verified
category: institutional-overreach
summary: >-
  NPR reported that Detroit police arrested Robert Williams after a Michigan State Police facial-recognition search of a
  low-quality store-security image returned him as a possible match; NPR said the charge was later dismissed for
  insufficient evidence. In a federal lawsuit, Williams alleged that investigators relied on the facial-recognition lead
  and a deficient lineup while omitting reliability problems from the warrant application. The parties settled the
  disputed claims in 2024 without an admission of liability, and Detroit agreed to investigation, training, audit, and
  independent-evidence safeguards.
