    title: >-
      Assurance of Discontinuance, In the Matter of Fantasia Trading LLC, Power Mobile Life LLC, and Smart Innovation,
      LLC
    publisher: Office of the New York Attorney General
    published_date: ''
    source_type: government-record
    reliability: primary
    key_claims:
      - >-
        Assurance No. 24-103 states that, before November 1, 2022, Eufy livestream video sent to the web portal lacked
        end-to-end encryption and at least part of the connection used no encryption.
      - >-
        The Assurance states that design and implementation flaws allowed anyone with a relevant URL to access an active
        stream without authentication and that deterministic URL rules may have made stream URLs deducible.
      - >-
        The Assurance says Anker acted promptly after the November 2022 public disclosure by implementing end-to-end
        encryption for web streams and strengthening access controls.
      - >-
        The respondents neither admitted nor denied the attorney general's findings, and the Assurance was accepted in
        lieu of a statutory proceeding.
