title: New York AG settlement addressed insecure Eufy video streams
status: verified
category: security-breach
summary: >-
  A January 2025 Assurance of Discontinuance said the New York Attorney General's investigation found that, before
  November 1, 2022, Eufy livestream video sent to its web portal lacked end-to-end encryption and at least part of the
  connection used no encryption. The office found active streams could be accessed without authentication by anyone with
  the relevant URL and that URLs might have been deducible. The respondents neither admitted nor denied the findings;
  the settlement required $450,000 in penalties and costs plus security controls.
