outcomes:
  - The respondents agreed to pay New York $450,000 in penalties and costs.
  - >-
    The Assurance requires substantiation of a comprehensive security program, secure-development processes,
    vulnerability testing, and encryption of covered audio-visual information in storage and transit.
  - >-
    The Assurance states that Anker acted promptly after the November 2022 disclosure by implementing end-to-end
    encryption for web streams and enhancing access controls.
