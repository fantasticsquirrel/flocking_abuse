  notes: >-
    Standing site-owner publication authorization applies. Two directly inspected New York Attorney General primary
    records support the findings and settlement, with the Assurance's neither-admit-nor-deny posture preserved.
    Classified as Security breach because the official findings document technical encryption and authentication
    failures that exposed active video streams to unauthorized access; this is not authorized credential misuse. Fresh
    live validation passed and deterministic dedupe against 78 other incident/candidate records returned no exact or
    probable match. The separate May 2021 Eufy server-upgrade cross-account mapping record was reviewed and is a
    distinct event.
