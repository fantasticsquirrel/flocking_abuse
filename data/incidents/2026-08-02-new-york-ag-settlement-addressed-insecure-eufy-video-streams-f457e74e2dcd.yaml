        The office said the investigation found that an active stream URL might have been deducible without obtaining it
        from a user.
      - >-
        The settlement required Fantasia Trading, Power Mobile Life, and Smart Innovation to pay $450,000 and
        substantiate information-security, vulnerability-management, secure-development, and encryption controls.
