title: Former Richland County deputy accused of misusing Flock cameras to track ex-girlfriend
status: verified
category: system-abuse
summary: >-
  Richland County Sheriff Leon Lott said former deputy Russell Kenton II used the department's Flock
  license-plate-reader system for personal reasons involving an ex-girlfriend. The department said a July 24
  Professional Standards audit found searches unrelated to law-enforcement work. Kenton was fired and arrested on a
  misconduct-in-office charge; the charge remains an allegation, and the cited reports do not state a final disposition.
