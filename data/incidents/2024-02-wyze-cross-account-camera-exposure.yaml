schema_version: 1
id: 2024-02-wyze-cross-account-camera-exposure
title: "Wyze incident exposed camera thumbnails and videos across customer accounts"
status: verified
summary: >-
  After a February 16, 2024 service outage, Wyze's systems associated some camera-event data
  with the wrong customer accounts. Wyze said about 13,000 users received thumbnails from
  cameras that were not their own and 1,504 users opened those thumbnails; in some cases an
  attached event video was viewed. Wyze removed the caching library involved and added another
  verification layer between users and event videos.
