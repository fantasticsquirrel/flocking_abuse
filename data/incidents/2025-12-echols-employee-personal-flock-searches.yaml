title: "Echols County employee charged over personal Flock searches"
status: verified
summary: >-
  The Georgia Bureau of Investigation said former Echols County Sheriff's Office secretary Anna
  Altobello used the agency's Flock account repeatedly for non-law-enforcement purposes to search
  tag information for two people she knew. GBI arrested her on data-misuse, stalking, family-violence
  stalking, and oath-violation charges.
