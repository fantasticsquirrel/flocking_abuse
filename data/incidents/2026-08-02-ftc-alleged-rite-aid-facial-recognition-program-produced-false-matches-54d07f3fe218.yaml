    reliability: primary
    key_claims:
      - >-
        The FTC said Rite Aid deployed artificial-intelligence-based facial recognition in hundreds of stores from 2012
        through 2020 to identify customers believed to have engaged in shoplifting or other problematic behavior.
      - >-
        The FTC alleged that the system generated thousands of false-positive matches and that employees acting on
        alerts followed, searched, removed, called police on, or publicly accused some customers.
      - >-
        The FTC said false-positive alerts were more likely in stores located in plurality-Black and Asian communities
        than in plurality-White communities.
      - >-
        The FTC filed a complaint and proposed an order that would prohibit Rite Aid from using facial recognition for
        surveillance for five years and require deletion, notice, complaint-response, and data-security safeguards.
