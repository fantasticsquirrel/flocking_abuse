title: FTC alleged Rite Aid facial-recognition program produced false matches
status: verified
category: institutional-overreach
summary: >-
  The Federal Trade Commission alleged that Rite Aid deployed facial-recognition surveillance in hundreds of stores from
  2012 through 2020 without reasonable safeguards and that false matches led employees to accuse or confront customers.
  The FTC said the system generated thousands of false-positive matches and disproportionately affected people of color.
  The agency filed a complaint and proposed an order that included a five-year facial-recognition ban; the cited release
  stated that the order still required bankruptcy-court and federal-district-court approval.
