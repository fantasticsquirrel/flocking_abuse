outcomes:
  - >-
    The FTC filed a federal complaint and a proposed stipulated order concerning Rite Aid’s facial-recognition
    deployment.
  - >-
    The proposed order would prohibit Rite Aid from using facial recognition for surveillance for five years and require
    deletion, consumer notice, complaint-response, biometric-data, and information-security safeguards.
  - >-
    The FTC’s December 19, 2023 release stated that the proposed order still required bankruptcy-court and
    federal-district-court approval and modification of a 2010 Commission order.
