title: "Kechi lieutenant used Flock to track estranged wife"
status: verified
summary: >-
  Sedgwick County prosecutors said former Kechi Police Lieutenant Victor Heiar used Wichita's
  Flock license-plate-reader system to monitor his estranged wife's location. Heiar pleaded guilty
  to misdemeanor computer crime and stalking, received 18 months of probation from a controlling
  24-month jail term, and later had his Kansas law-enforcement certification revoked.
