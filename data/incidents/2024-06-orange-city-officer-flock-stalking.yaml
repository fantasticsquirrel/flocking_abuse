title: "Orange City officer accused of repeated Flock tracking"
status: verified
summary: >-
  A Volusia County arrest affidavit, as reported by WKMG, said Orange City officer Jarmarus Brown
  repeatedly searched three vehicles in Flock over roughly seven months while allegedly stalking a
  former partner. Brown was arrested, and a later Florida certification report recorded his no-
  contest plea to a computer offense.
