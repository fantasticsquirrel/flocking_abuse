title: "Former Coffee County deputy charged over plate data and stalking"
status: verified
summary: >-
  A Georgia Bureau of Investigation inquiry that began after a woman reported alleged stalking and
  other misconduct led to the arrest of former Coffee County deputy Chris Ashley Rozar. Charges
  included prohibited use of captured license plate data, computer invasion of privacy, stalking,
  and violation of oath.
