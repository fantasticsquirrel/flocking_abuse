schema_version: 1
id: 2026-08-03-wyze-left-customer-and-camera-metadata-exposed-in-unsecured-databases-807cba992326
title: Wyze disclosed customer metadata exposure and a second unprotected database
status: verified
category: security-breach
summary: >-
  Wyze said a separate query database containing a subset of production data was left exposed from December 4 through
  December 26, 2019 after an employee removed its security protocols. The company then disclosed an additional
  unprotected non-production database while saying it was still determining what further information leaked and why. In
  its aggregate update, Wyze said the exposed information included account, camera, device, network, profile,
  integration-token, and limited beta-tester body-metric data; it said the leak did not contain passwords, financial
  information, or video files, and that all users who had created an account before December 26 were affected.
