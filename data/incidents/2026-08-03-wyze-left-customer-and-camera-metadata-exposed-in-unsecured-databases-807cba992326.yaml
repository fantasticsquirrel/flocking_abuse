  notes: >-
    Originating query: Wyze 2019 data breach 2.4 million camera users. Discovery transport: Google News RSS, followed by
    the robots-allowed Wyze forum sitemap. The primary source is Wyze’s official, incrementally updated disclosure;
    claims are bounded to the company’s statements. News headlines estimated roughly 2.4 million customers, but this
    candidate does not adopt that numeric estimate because the directly cited primary source states scope as all
    accounts created before December 26, 2019. Deterministic comparison found no exact or probable matches against the
    complete live and current-repository incident/candidate frontiers; unverified and published-candidate identity
    indexes were also checked. This event is distinct from the accepted February 2024 Wyze cross-account
    camera-thumbnail/video exposure: the 2019 event involved customer and camera metadata in one unsecured query
    database plus a separately disclosed unprotected database whose additional contents remained unresolved, and Wyze
    said the aggregate leak included no video files. The URL-only scraper recorded manual-seed-file; the real query
    provenance is preserved here. Wayback CDX was unavailable with HTTP 429 through curl and browser retry, so no
    archive URL is claimed. An initial independent review of the pre-fix candidate rejected conflation of the first
    query database with a separately disclosed additional database and misclassification of Wyze Labs as an agency. This
    version separates the two database claims, labels later scope and data types as aggregate, uses Wyze Labs as the
    entity/vendor, and limits location to the source-stated Seattle headquarters. A second independent review rejected
    the prior title because it could imply that both databases had established customer/camera contents and rejected the
    workflow-placeholder outcome. This version avoids assigning contents to the second database and records the
    source-attributed remediation outcomes. Final independent exact-candidate review APPROVED digest
    3aad2b5686080b0d19fc6035cd00a34b3990e4453164164867ee7ba284399f82 at repository revision
    70162ff9aca2458183ad627afdab2baef6816478 in independent Hermes review session 20260803_143832_abfd16 after two
    earlier rejected digests were corrected. Publication uses the owner-authorized protected admin workflow and
    preserves attribution and the unresolved second-database contents.
