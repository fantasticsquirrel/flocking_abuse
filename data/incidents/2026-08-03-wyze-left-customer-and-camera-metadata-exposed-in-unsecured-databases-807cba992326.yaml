sources:
  - url: https://forums.wyze.com/t/updated-02-13-20-data-leak-12-26-2019/79046
    title: '[Updated 02-13-20] Data leak 12-26-2019'
    publisher: Wyze Labs
    published_date: '2019-12-27'
    source_type: official-statement
    reliability: primary
    key_claims:
      - >-
        Wyze confirmed that a separate query database containing a subset of production data was left exposed from
        December 4 through December 26, 2019 after an employee removed its security protocols.
      - >-
        Wyze said it found an additional unprotected non-production database and was still determining what additional
        information leaked and the circumstances of that exposure.
      - >-
        In its aggregate update, Wyze said exposed information included account nicknames, device names, user emails,
        profile photos, WiFi network names, some Alexa integration tokens, and body metrics for about 140 beta testers.
      - >-
        Wyze said the leak did not contain passwords, government-regulated personal or financial information, or video
        files, and that all users who created accounts before December 26, 2019 were affected.
      - >-
        Wyze said it restricted database access, refreshed integration tokens, forced account reauthentication, notified
        customers, and later completed initial investigation and internal server and database security measures.
