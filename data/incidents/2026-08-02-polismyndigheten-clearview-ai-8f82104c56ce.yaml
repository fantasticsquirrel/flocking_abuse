  notes: >-
    Standing owner authorization applies to this continuous camera-system hunt. Classified as Policy abuse because the
    official decision documents employees using valid occupational access and police-held images with an application the
    authority had neither provided nor approved, contrary to data-protection controls; this was not a technical
    compromise. Source and appellate posture were directly inspected, and deterministic post-enrichment dedupe returned
    no exact or probable matches.
