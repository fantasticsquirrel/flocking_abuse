outcomes:
  - IMY imposed a 2.5 million SEK administrative fine and corrective orders on 10 February 2021.
  - The Administrative Court dismissed the appeal on 30 September 2021 in case 4756-21.
  - The Stockholm Court of Appeal annulled the lower-court judgment and IMY fine on 7 November 2022 in case 7678-21.
  - >-
    The Supreme Administrative Court denied leave to appeal on 17 November 2023 in case 6943-22, leaving the appellate
    judgment standing.
  - The cited official records do not establish that any identified data subject suffered actual harm.
