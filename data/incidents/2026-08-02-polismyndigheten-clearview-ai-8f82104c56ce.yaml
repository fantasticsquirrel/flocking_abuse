title: Swedish police employees used unapproved Clearview AI application
status: verified
category: policy-abuse
summary: >-
  Sweden's data-protection authority, IMY, recorded that employees of the Swedish Police Authority used Clearview AI in
  operational police work from autumn 2019 through 3 March 2020 even though the authority had not provided or approved
  the application. IMY found that the processing violated the Criminal Data Act, imposed a 2.5 million SEK fine, and
  issued corrective orders. IMY's current case page states that the Court of Appeal later annulled the fine and that the
  Supreme Administrative Court denied leave to appeal, so that appellate outcome stands.
