  - url: https://www.imy.se/globalassets/dokument/beslut/beslut-tillsyn-polismyndigheten-cvai.pdf
    title: Beslut efter tillsyn enligt brottsdatalagen – Polismyndighetens användning av Clearview AI
    publisher: Integritetsskyddsmyndigheten (IMY)
    published_date: '2021-02-10'
    source_type: government-record
    archive_url: >-
      https://web.archive.org/web/20260314201058/https://www.imy.se/globalassets/dokument/beslut/beslut-tillsyn-polismyndigheten-cvai.pdf
    reliability: primary
    key_claims:
      - >-
        The decision records that Police Authority employees used Clearview AI on multiple occasions from autumn 2019
        through 3 March 2020 without the authority providing or approving the application.
      - >-
        The decision says employees in the National Operations Department and Police Region South used the application,
        including in operational investigations and testing against police-held imagery.
      - >-
        IMY found that the Police Authority had not demonstrated adequate organizational controls, processed biometric
        data contrary to the Criminal Data Act, and failed to perform a required impact assessment.
      - >-
        IMY imposed a 2.5 million SEK fine and ordered training and organizational measures, notice to affected data
        subjects subject to statutory limits, and feasible steps to delete data uploaded to Clearview AI.
