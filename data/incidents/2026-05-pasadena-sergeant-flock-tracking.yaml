title: "Pasadena sergeant resigned amid alleged Flock tracking probe"
status: verified
summary: >-
  Pasadena police confirmed that Sgt. Michael Palitz resigned while under an active internal
  investigation. City Council Member Emmanuel Guerrero said the investigation concerned
  allegations that Palitz used the department's Flock license-plate system to track a female
  officer. The department said its investigation would continue after the resignation.
