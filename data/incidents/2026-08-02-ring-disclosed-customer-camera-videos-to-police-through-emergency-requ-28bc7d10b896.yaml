title: Ring disclosed customer camera videos to police through emergency requests without owner consent
status: verified
category: institutional-overreach
summary: >-
  Amazon told U.S. Senator Edward J. Markey that Ring had provided customer videos to law-enforcement agencies 11 times
  during 2022 in response to emergency requests without device-owner consent. Amazon said it made a good-faith
  determination in each instance that imminent danger of death or serious physical injury required disclosure without
  delay. The public response did not identify the requesting agencies, affected customers, or underlying emergencies.
