title: "Riverside County deputy convicted after using Flock in stalking campaign"
status: verified
summary: >-
  Prosecutors said former Riverside County Sheriff's Deputy Alexander Ravy Vanny used the agency's
  Flock system to obtain license-plate information for vehicles associated with his former fiancée,
  including a close friend's vehicle, as part of a broader stalking campaign. A jury convicted
  Vanny of stalking, unauthorized use of protected electronic data, and several other offenses in
  December 2025. He was sentenced to six years in California state prison in February 2026.
