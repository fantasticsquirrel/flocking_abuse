title: "Charlotte officer charged after unauthorized Flock query"
status: verified
summary: >-
  The Charlotte-Mecklenburg Police Department said the North Carolina State Bureau of
  Investigation found that Officer Seth Elliott accessed Flock and CJLEADS once for a
  non-law-enforcement purpose. Elliott was arrested on an illegal-access charge and placed
  on unpaid administrative leave.
