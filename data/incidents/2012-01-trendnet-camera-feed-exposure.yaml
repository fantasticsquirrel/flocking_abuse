id: 2012-01-trendnet-camera-feed-exposure
title: "TRENDnet camera flaw exposed private live feeds without passwords"
status: verified
summary: >-
  A software flaw in TRENDnet SecurView internet cameras allowed people who knew a camera's
  internet address to view live video, and sometimes audio, without login credentials. The
  Federal Trade Commission said links to nearly 700 private camera feeds were posted online,
  including feeds showing children and activity inside homes. TRENDnet issued firmware updates,
  and the FTC later entered a final consent order requiring a security program and assessments.
