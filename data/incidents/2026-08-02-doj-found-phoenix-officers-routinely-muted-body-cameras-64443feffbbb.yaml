sources:
  - url: https://www.justice.gov/crt/media/1355866/dl?inline
    title: DOJ found Phoenix officers routinely muted body cameras
    publisher: U.S. Department of Justice Civil Rights Division
    published_date: '2024-06-13'
    source_type: government-record
    archive_url: https://web.archive.org/web/20260525073838/https://www.justice.gov/crt/media/1355866/dl?inline
    reliability: primary
    key_claims:
      - >-
        The Justice Department said Phoenix Police Department policy required officers to activate body-worn cameras
        during law-enforcement contacts but did not address muting, even though the department configured the cameras to
        permit it.
      - >-
        The findings report said officers frequently muted body-worn cameras after uses of force and that officers and
        sergeants routinely did so, often without a clear reason.
      - >-
        The report said the timing in some incidents raised concerns that officers muted cameras to intentionally
        obfuscate or enable conversations they knew were inappropriate.
      - >-
        The Justice Department recommended consistent activation, deactivation, and supervisory review and preventing
        officers from muting cameras.
  - url: https://www.abc15.com/news/region-phoenix-metro/phoenix-police-roll-out-new-body-cameras
    title: Phoenix police roll out new body cameras
    publisher: ABC15 Arizona / Associated Press
    published_date: '2019-04-15'
    source_type: news
    reliability: background
    key_claims:
      - >-
        ABC15 and the Associated Press reported that Phoenix Police Department began deploying Axon body-worn cameras in
        April 2019.
      - >-
        The report said the Phoenix City Council had approved a five-year contract with Axon Enterprise to provide
        cameras for 2,000 officers and maintain video.
