  notes: >-
    The June 2024 Justice Department findings report is the primary source for the department-wide camera-accountability
    findings; all findings remain attributed to DOJ. ABC15/Associated Press identifies Axon Enterprise as Phoenix's
    body-worn-camera and video-maintenance vendor, but does not suggest Axon directed or endorsed the conduct.
    Classified as Institutional overreach because DOJ described an institution-level camera configuration and policy
    gap, routine muting by officers and sergeants, and weak supervisory accountability; this is not a technical breach
    or cross-account exposure. Occurrence date remains unknown because the report does not establish a complete date
    range for the practice. Protected intake returned no duplicate warning, and post-enrichment deterministic comparison
    against 80 other live incident/candidate records returned empty exact and probable arrays; Reported but Unverified
    had no matching identity. The event is distinct from the Columbus deliberate camera-disablement records and Dallas
    unauthorized recording-release record. Existing Wayback preservation was found for the DOJ PDF; no ABC15 snapshot
    was available, and fresh Wayback and archive.ph requests returned HTTP 429. Originating queries are preserved in the
    coordination notes and claim-scoped query map because the URL-only scraper recorded manual-seed-file.
