title: DOJ found Phoenix officers routinely muted body cameras
status: verified
category: institutional-overreach
summary: >-
  In a June 2024 findings report, the U.S. Department of Justice said Phoenix officers frequently muted body-worn
  cameras after uses of force, often without a clear reason, and that officers and sergeants routinely did so. The
  report said some timing raised concerns about intentional obfuscation or enabling conversations officers knew were
  inappropriate. It also said department policy required activation during law-enforcement contacts but did not address
  muting.
