title: Dallas officer fired after unauthorized body-camera recording release
status: verified
category: system-abuse
summary: >-
  The Dallas Police Department stated that officer Ali Toppa turned himself in on an outstanding Class A misdemeanor
  warrant alleging unauthorized release of a body-worn-camera recording. The department placed him on administrative
  leave and later terminated him after a disciplinary hearing. The public statements do not describe the recording,
  recipient, release date, or disposition of the criminal charge; a City Auditor report separately identifies Axon as
  Dallas Police Department’s body-worn and in-car camera-system vendor.
