  notes: >-
    Standing owner authorization applies through the protected candidate-bound publisher. Classified as system abuse
    because the official record describes an officer’s unauthorized release of a recording from an occupational
    body-camera system; this is not a technical breach. The City Auditor source identifies Axon as DPD’s camera-system
    vendor but does not suggest Axon directed or endorsed the conduct. The official statements do not disclose the
    recording, recipient, release date, access method, or criminal-case disposition, so the report makes no inference
    about those points and leaves occurred unknown. Dedupe covered 109 repository/runtime frontier records, 58 live
    incidents, current candidates and unverified records, all research notes, URLs, canonical keys, agencies, people,
    dates, and event fingerprints; no Ali Toppa, Dallas Police Department, or matching unauthorized-recording-release
    record appeared. This event is distinct from the published Columbus Axon footage-download/disclosure case and the
    Nashville WatchGuard transfer/editing records. Originating queries were `"body camera" officer unauthorized access
    footage internal affairs`, `"Ali Toppa" Dallas Police Department`, and `Axon body worn camera Dallas Police`;
    `/tmp/flock-query-url-map.json` preserves the exact query-to-URL map because the URL-only scraper recorded
    `manual-seed-file`. The scraper directly fetched both DPD Beat official statements but its Flock/ALPR relevance
    model scored them uncertain; it failed the City audit PDF because the source host omitted its TLS intermediate
    certificate. Direct curl inspection likewise failed closed on certificate verification, while browser inspection of
    the official City search result exposed the audit title and Axon/camera-count excerpt. Existing Wayback snapshots
    were found for all three cited sources. Fresh Wayback saves and all archive.ph lookups/submissions returned HTTP
    429; no restriction or CAPTCHA was bypassed.
