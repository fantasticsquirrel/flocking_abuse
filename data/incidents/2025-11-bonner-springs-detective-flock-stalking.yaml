title: "Bonner Springs detective charged after alleged plate-reader stalking"
status: verified
summary: >-
  The Kansas Bureau of Investigation said former Bonner Springs detective Kyle Rector allegedly
  used department resources to monitor and stalk his estranged wife while on duty. Court-record
  reporting said the resources included license-plate readers such as Flock, which he allegedly
  used to track his wife and two men he suspected she was seeing. He was fired and later arrested.
