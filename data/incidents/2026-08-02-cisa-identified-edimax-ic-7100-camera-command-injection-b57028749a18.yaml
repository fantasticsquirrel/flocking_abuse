sources:
  - url: https://www.cisa.gov/news-events/ics-advisories/icsa-25-063-08
    title: Edimax IC-7100 IP Camera
    publisher: Cybersecurity and Infrastructure Security Agency
    published_date: '2025-03-04'
    source_type: government-record
    archive_url: https://web.archive.org/web/20260709154426/https://www.cisa.gov/news-events/ics-advisories/icsa-25-063-08
    reliability: primary
    key_claims:
      - CISA identified all versions of the Edimax IC-7100 IP camera as affected by CVE-2025-1316.
      - CISA said specially crafted requests could achieve remote code execution on the device.
      - >-
        CISA characterized the vulnerability as remotely exploitable with low attack complexity and public exploits
        available.
      - CISA said Akamai SIRT reported the vulnerability to the agency.
  - url: https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json
    title: CISA Catalog of Known Exploited Vulnerabilities
    publisher: Cybersecurity and Infrastructure Security Agency
    published_date: '2026-07-29'
    source_type: government-record
    reliability: primary
    key_claims:
      - >-
        CISA’s catalog includes CVE-2025-1316 under Edimax and the IC-7100 IP Camera, with a date-added value of March
        19, 2025.
      - >-
        The catalog describes operating-system command injection that permits remote code execution through specially
        crafted requests.
      - >-
        CISA required federal agencies to apply mitigations or discontinue use if mitigations were unavailable by April
        9, 2025.
      - >-
        The catalog marks known ransomware-campaign use as unknown and does not identify an attacker or quantify
        affected devices.
  - url: https://www.edimax.com/edimax/post/post/data/edimax/global/press_releases/4801/
    title: Official Statement on CVE-2025-1316 (Legacy IC-7100 Camera)
    publisher: Edimax Technology Co., Ltd.
    published_date: '2025-03-10'
    source_type: official-statement
    archive_url: >-
      https://web.archive.org/web/20260731070001/https://www.edimax.com/edimax/post/post/data/edimax/global/press_releases/4801/
    reliability: primary
    key_claims:
      - Edimax acknowledged the security report concerning CVE-2025-1316 and the IC-7100 network camera.
      - >-
        Edimax said the IC-7100 had been discontinued for more than ten years and that technical support and firmware
        maintenance had ended.
      - >-
        Edimax said no security patch or firmware update could be provided because the development environment and
        source code were unavailable.
      - >-
        Edimax recommended avoiding internet exposure, restricting access with a firewall or NAT, changing the default
        administrator password, and monitoring access logs.
