id: 2026-08-02-cisa-identified-edimax-ic-7100-camera-command-injection-b57028749a18
title: CISA cataloged Edimax IC-7100 camera flaw as known exploited
status: verified
category: security-breach
summary: >-
  The U.S. Cybersecurity and Infrastructure Security Agency identified an operating-system command-injection
  vulnerability affecting all versions of the Edimax IC-7100 IP camera and later listed it in the agency’s Known
  Exploited Vulnerabilities Catalog. CISA said specially crafted requests could enable remote code execution; Edimax
  said the camera was a discontinued legacy product for which no security patch or firmware update could be provided.
