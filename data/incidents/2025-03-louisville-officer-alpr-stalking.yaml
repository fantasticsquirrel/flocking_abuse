title: "Louisville officer indicted after alleged ALPR stalking"
status: verified
summary: >-
  Louisville police said an internal investigation found criminal conduct by former officer Roberto
  Cedeno, who was accused in court of using law-enforcement systems, including Flock reporting, to
  track a former partner and others. A grand jury indicted him on nine charges including stalking,
  unlawful computer access, tampering with records, and official misconduct.
