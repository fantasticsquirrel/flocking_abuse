title: "Braselton police chief charged after alleged ALPR stalking"
status: verified
summary: >-
  The Georgia Bureau of Investigation said Braselton Police Chief Michael Steffman misused automated
  license-plate recognition systems to harass and stalk multiple people. He was arrested on charges
  including stalking, harassing communications, violation of oath, and multiple ALPR-misuse counts.
