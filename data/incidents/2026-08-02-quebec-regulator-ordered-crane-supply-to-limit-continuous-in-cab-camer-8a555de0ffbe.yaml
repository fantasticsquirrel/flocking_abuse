    title: Quebec regulator ordered Crane Supply to limit continuous in-cab camera recording
    publisher: Commission d’accès à l’information du Québec
    published_date: '2025-05-20'
    source_type: government-record
    reliability: primary
    key_claims:
      - >-
        The decision states that Crane Supply installed a bidirectional video-surveillance system in all delivery
        vehicles around February 2023 and linked camera recordings to drivers through personal identification codes.
      - >-
        The system recorded inside vehicle cabins from engine start until 20 minutes after shutdown and used AI-driven
        features to generate reports about predefined events including phone use, smoking, camera obstruction, possible
        collisions, and speeding.
      - >-
        The Commission concluded that the company had not sufficiently minimized the privacy intrusion and had not
        demonstrated that the full collection was necessary.
      - >-
        The Commission ordered the company within 90 days to limit in-cab image collection to a few seconds before and
        after a defined incident or stop collecting it, cease post-shutdown capture, and destroy recording portions
        beyond an accident or major-incident sequence.
legal_or_policy_context:
  case_numbers: []
  statutes_or_policies: []
outcomes:
  - >-
    The Commission ordered Crane Supply within 90 days to limit in-cab image collection to a few seconds before and
    after a defined incident or, failing that, stop collecting interior images.
  - >-
    The Commission ordered the company to stop collecting interior images after the engine is turned off and to destroy
    recording portions beyond accident or major-incident sequences.
  - >-
    The Commission recommended revising the dash-camera policy so interior images may be accessed and used only for
    accidents or major incidents.
