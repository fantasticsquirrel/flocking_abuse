title: Quebec regulator ordered Crane Supply to limit continuous in-cab camera recording
status: verified
category: institutional-overreach
summary: >-
  Quebec’s privacy regulator found that Crane Supply had not sufficiently minimized the privacy intrusion from an
  AI-enabled, dual-facing camera system installed across its delivery fleet. The system linked recordings to identified
  drivers, recorded vehicle cabins while engines were running and for 20 minutes after shutdown, and generated incident
  reports. The regulator recognized legitimate safety purposes but ordered the company to limit in-cab recording to
  brief incident windows or stop collecting it, end post-shutdown recording, and destroy excess footage.
