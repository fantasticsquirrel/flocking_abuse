id: 2024-10-norfolk-flock-constitutional-challenge
title: "Norfolk residents challenged warrantless citywide Flock tracking"
status: verified
summary: >-
  Two Norfolk-area residents sued the City of Norfolk and its police chief, alleging that the city's
  network of more than 170 Flock cameras creates a searchable record of drivers' movements without
  a warrant or probable cause in violation of the Fourth Amendment. The complaint was filed in the
  U.S. District Court for the Eastern District of Virginia.
