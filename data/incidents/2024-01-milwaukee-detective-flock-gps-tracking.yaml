id: 2024-01-milwaukee-detective-flock-gps-tracking
title: "Milwaukee internal-affairs detective charged over Flock and GPS tracking"
status: verified
summary: >-
  A criminal complaint alleges Milwaukee Police Detective Tehrangi Chapman used the department's
  Flock system 20 times to track two people for personal reasons, entering "test" or "training" as
  search justifications. Prosecutors also allege he placed a GPS device on one person's vehicle.
  Chapman was charged with felony misconduct in public office and misdemeanor misuse of a GPS
  device. He remained suspended from the department and received a signature bond at his initial
  court appearance; the cited sources do not establish a final disposition.
