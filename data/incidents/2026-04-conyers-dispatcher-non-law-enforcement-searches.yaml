title: "Conyers dispatcher supervisor charged after Flock audit"
status: verified
summary: >-
  The Georgia Bureau of Investigation said Conyers Police Department dispatcher supervisor Paige
  Forte accessed the Flock system more than 30 times from April through July 2026 for non-law-
  enforcement purposes. She was arrested after an internal audit and GBI investigation.
