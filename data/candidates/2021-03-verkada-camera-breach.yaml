id: 2021-03-verkada-camera-breach
status: candidate
title: "FTC alleged Verkada security failures exposed more than 150,000 live cameras"
summary: >-
  The Federal Trade Commission alleged that Verkada failed to use appropriate security controls, enabling a March
  2021 breach that exposed more than 150,000 live customer cameras along with addresses, audio recordings, and Wi-Fi
  credentials. The accessed feeds included psychiatric hospitals and women's health clinics. Verkada entered a federal
  settlement requiring a comprehensive security program, third-party audits, and restrictions on future security and
  privacy claims.
