id: 2017-06-ring-employee-private-video-spying
status: candidate
title: "FTC alleged Ring employees used broad access to spy through customer cameras"
summary: >-
  The Federal Trade Commission alleged that Ring gave every employee and hundreds of contractors unrestricted access
  to customer videos, enabling repeated misuse. One employee viewed thousands of recordings from at least 81 female
  users, focusing on cameras labeled as bedrooms or bathrooms, while later incidents included employees watching a
  colleague, disclosing recording information to a customer's former spouse, and accessing videos without consent.
  Ring settled the FTC case and agreed to privacy controls, video deletion, and consumer payments.
