title: "San Diego lawsuit says police used a Flock hit that placed suspects away from crime"
summary: >-
  Hugo Parra and Ariel Beltran allege San Diego police arrested them after treating a Flock image
  of Beltran's red Alfa Romeo as corroboration for an attempted carjacking, even though the image's
  time and location placed the car about five miles from the crime. Parra spent nearly a month in
  jail before prosecutors dropped the assault-with-a-firearm and evasion charges. The men filed a
  federal civil-rights lawsuit in June 2026; their allegations have not been adjudicated.
