id: 2022-07-nashville-watchguard-incomplete-recordings
status: candidate
title: "WatchGuard transfers left Nashville police recordings incomplete"
summary: >-
  The Metropolitan Nashville Police Department reported that recordings fully received by its upload server were
  incomplete after transfer to long-term storage in its Motorola Solutions WatchGuard system. The affected material
  included body-worn and in-car recordings associated with 183 arrest or citation situations plus hundreds of other
  submissions. A random review also found at least 1 continuous second of frame loss on 12 of 14 body cameras tested.
