status: candidate
title: "Texas sheriff's office used national Flock search in abortion-related investigation"
summary: >-
  404 Media reported that the Johnson County Sheriff's Office in Texas searched a nationwide Flock camera
  network for a woman who had self-administered an abortion. The sheriff's office and Flock initially described
  the search as a missing-person safety effort; later 404 Media reporting said court records characterized the
  matter as a death investigation and showed that investigators considered possible criminal charges.
