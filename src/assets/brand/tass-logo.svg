  <path fill="#e6192a" d="m625 627 56 4-12 45-8 50-14-35-13-19-9-45Z"/>
  <path fill="#e6192a" d="M659 720c8 15 11 24 11 32 0 8-5 15-12 15s-12-7-12-15c0-8 4-17 13-32Z"/>

