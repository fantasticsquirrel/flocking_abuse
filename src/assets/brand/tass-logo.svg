<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">The Abusive Surveillance State logo</title>
  <desc id="desc">A damaged black surveillance camera with a red shutter lens, red drip, and cracked housing.</desc>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#182020"/>
      <stop offset="1" stop-color="#090d0d"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff2d2d"/>
      <stop offset="1" stop-color="#c90018"/>
    </linearGradient>
  </defs>

  <!-- Wall plate and articulated arm -->
  <path fill="url(#body)" d="M117 563c0-17 14-31 31-31h112c17 0 31 14 31 31v41l-71 24 177-61 80 91-201 109 15 8v81c0 17-14 31-31 31H148c-17 0-31-14-31-31V563Z"/>
