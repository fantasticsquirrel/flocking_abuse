  <g transform="translate(648 526)" fill="#e6192a">
    <path d="M-21-108A110 110 0 0 1 49-93L18-34a43 43 0 0 0-27-8Z"/>
    <path d="M58-88a110 110 0 0 1 47 55L40-13A43 43 0 0 0 23-31Z"/>
